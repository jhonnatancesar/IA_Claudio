[project]
name = "claudiao-backend"
version = "0.1.0"
description = "Núcleo do agente Claudião (ver docs/ na raiz do repositório)."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
